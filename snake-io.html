<title>Slither — Snake.io</title>
<style>
  :root {
    --bg-0: #07091a;
    --bg-1: #0f1530;
    --accent: #ffd24a;
    --danger: #ff4d6d;
    --text: #eaf0ff;
    --muted: #8895b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }

  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hud {
    position: fixed;
    top: env(safe-area-inset-top, 0);
    left: 0;
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    pointer-events: none;
    z-index: 10;
  }

  .hud-card {
    background: rgba(7, 9, 26, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 13px;
  }

  .hud-card .label {
    color: var(--muted);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 2px;
  }

  .hud-card .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .score .value { color: var(--accent); }
  .length .value { color: #b8ff7e; }

  .leaderboard {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0) + 14px);
    right: 16px;
    background: rgba(7, 9, 26, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 11px;
    z-index: 10;
    min-width: 130px;
    pointer-events: none;
  }

  .leaderboard .lb-title {
    color: var(--muted);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    text-align: center;
  }

  .leaderboard .lb-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 0;
    font-variant-numeric: tabular-nums;
  }

  .leaderboard .lb-row.you {
    color: var(--accent);
    font-weight: 700;
  }

  .leaderboard .lb-row .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 80px;
  }

  .boost-bar {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0));
    left: 50%;
    transform: translateX(-50%);
    width: min(260px, 55vw);
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    z-index: 10;
    pointer-events: none;
  }

  .boost-bar .fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--accent), #ffb340);
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(255, 210, 74, 0.6);
    transition: background 0.2s;
  }

  .boost-bar.boosting .fill {
    background: linear-gradient(90deg, #ff7eb3, var(--accent));
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(7, 9, 26, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    padding: 24px;
  }

  .overlay.hidden { display: none; }

  .panel {
    background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .panel h1 {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -1.5px;
    background: linear-gradient(135deg, #ffd24a, #ff7eb3, #6ee7ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .panel p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .panel .stats {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
  }

  .panel .stat {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 12px 8px;
  }

  .panel .stat .label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }

  .panel .stat .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .panel .stat.s1 .value { color: var(--accent); }
  .panel .stat.s2 .value { color: #b8ff7e; }
  .panel .stat.s3 .value { color: #6ee7ff; }

  button {
    background: linear-gradient(135deg, var(--accent), #ffb340);
    border: none;
    color: #1a1408;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 16px 32px;
    border-radius: 999px;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 8px 24px rgba(255, 210, 74, 0.3);
    transition: transform 0.15s ease;
    font-family: inherit;
  }

  button:active { transform: scale(0.97); }

  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }

  .hint strong { color: var(--text); }

  /* Virtual joystick */
  .joy-base, .joy-thumb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 9;
  }

  .joy-base {
    width: 110px;
    height: 110px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .joy-thumb {
    width: 50px;
    height: 50px;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(255,210,74,0.85));
    box-shadow: 0 4px 16px rgba(255, 210, 74, 0.4), inset 0 -3px 8px rgba(0,0,0,0.2);
  }

  /* Left-side boost zone indicator */
  .boost-zone {
    position: fixed;
    bottom: calc(40px + env(safe-area-inset-bottom, 0));
    left: 32px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 126, 179, 0.18), rgba(255, 126, 179, 0.05));
    border: 2px solid rgba(255, 126, 179, 0.35);
    pointer-events: none;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.85);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }

  .boost-zone.active {
    transform: scale(1.12);
    background: radial-gradient(circle, rgba(255, 210, 74, 0.45), rgba(255, 126, 179, 0.15));
    border-color: rgba(255, 210, 74, 0.9);
    box-shadow: 0 0 28px rgba(255, 210, 74, 0.5);
  }

  .boost-zone .icon {
    font-size: 28px;
    line-height: 1;
  }

  /* Hide boost zone & joystick on overlays */
  body.menu .boost-zone,
  body.menu .boost-bar,
  body.menu .hud,
  body.menu .leaderboard {
    opacity: 0;
    transition: opacity 0.2s;
  }
</style>
</head>
<body class="menu">

<canvas id="game"></canvas>

<div class="hud">
  <div class="hud-card score">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="hud-card length">
    <div class="label">Length</div>
    <div class="value" id="length">10</div>
  </div>
</div>

<div class="leaderboard" id="leaderboard">
  <div class="lb-title">Leaderboard</div>
  <div id="lbRows"></div>
</div>

<div class="boost-bar" id="boostBar"><div class="fill" id="boostFill"></div></div>

<div class="boost-zone" id="boostZone"><div class="icon">⚡</div></div>

<div class="joy-base" id="joyBase"></div>
<div class="joy-thumb" id="joyThumb"></div>

<div class="overlay" id="startOverlay">
  <div class="panel">
    <h1>SLITHER</h1>
    <p>Eat orbs to grow. Make other snakes crash into you. Don't crash yourself.</p>
    <button id="startBtn">TAP TO PLAY</button>
    <div class="hint">
      <strong>Right thumb</strong> drag to steer<br>
      <strong>Left thumb</strong> hold to boost
    </div>
  </div>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <div class="panel">
    <h1>GAME OVER</h1>
    <div class="stats">
      <div class="stat s1">
        <div class="label">Score</div>
        <div class="value" id="finalScore">0</div>
      </div>
      <div class="stat s2">
        <div class="label">Length</div>
        <div class="value" id="finalLength">0</div>
      </div>
      <div class="stat s3">
        <div class="label">Rank</div>
        <div class="value" id="finalRank">—</div>
      </div>
    </div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const WORLD_RADIUS = 1800;
  const FOOD_COUNT = 450;
  const BOT_COUNT = 14;
  const TAU = Math.PI * 2;

  let dpr = 1;
  let viewW = 0, viewH = 0;
  const camera = { x: 0, y: 0, zoom: 1 };
  const food = [];
  const snakes = [];
  let player = null;
  let running = false;
  let lastTime = 0;
  let frame = 0;

  // Two-thumb input: right side = steer joystick, left side = boost button
  const input = {
    boost: false,
    targetAngle: 0,
    hasTarget: false,
    // Right-side virtual joystick
    steerTouchId: null,
    steerOriginX: 0, steerOriginY: 0,
    steerCurX: 0, steerCurY: 0,
    // Left-side boost touch
    boostTouchId: null
  };

  const BOT_NAMES = [
    'Viper', 'Cobra', 'Mamba', 'Python', 'Anaconda', 'Asp', 'Adder',
    'Boa', 'Sidewinder', 'Krait', 'Taipan', 'Rattler', 'Diamondback',
    'Constrictor', 'Garter', 'Copperhead', 'Coral', 'Bushmaster',
    'Slytherin', 'Nagini', 'Kaa', 'Hisss', 'Sneaky', 'Slinky'
  ];

  const SNAKE_PALETTES = [
    ['#ff6b9d', '#c44569', '#ffd2dc'],
    ['#6ee7ff', '#0ea5e9', '#dff7ff'],
    ['#b8ff7e', '#65d645', '#e3ffd2'],
    ['#ffd24a', '#ff9500', '#fff4cc'],
    ['#c084fc', '#7c3aed', '#e9d5ff'],
    ['#ff7eb3', '#ff4d6d', '#ffd6e0'],
    ['#7dd3fc', '#0284c7', '#e0f2fe'],
    ['#fbbf24', '#d97706', '#fef3c7'],
    ['#fb7185', '#e11d48', '#ffe4e6'],
    ['#86efac', '#16a34a', '#dcfce7'],
    ['#a78bfa', '#6d28d9', '#ede9fe'],
    ['#fcd34d', '#f59e0b', '#fef9c3']
  ];

  function rand(min, max) { return min + Math.random() * (max - min); }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function angleDiff(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }
  function dist2(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  }

  function makeFood(x, y, value, isCorpse, color) {
    const palette = ['#ffd24a', '#ff7eb3', '#6ee7ff', '#b8ff7e', '#c084fc', '#fbbf24', '#fb7185'];
    return {
      x, y,
      value: value || 1,
      radius: 4 + Math.sqrt(value || 1) * 1.5,
      color: color || pick(palette),
      pulse: Math.random() * TAU,
      isCorpse: !!isCorpse
    };
  }

  function spawnFoodInWorld() {
    const angle = Math.random() * TAU;
    const r = Math.sqrt(Math.random()) * (WORLD_RADIUS - 50);
    return makeFood(Math.cos(angle) * r, Math.sin(angle) * r, 1);
  }

  function initFood() {
    food.length = 0;
    for (let i = 0; i < FOOD_COUNT; i++) food.push(spawnFoodInWorld());
  }

  function makeSnake(opts) {
    const palette = opts.palette || pick(SNAKE_PALETTES);
    const angle = opts.angle != null ? opts.angle : Math.random() * TAU;
    const x = opts.x != null ? opts.x : 0;
    const y = opts.y != null ? opts.y : 0;
    const startLength = opts.length || 10;

    const segments = [];
    for (let i = 0; i < startLength * 2; i++) {
      segments.push({
        x: x - Math.cos(angle) * i * 3,
        y: y - Math.sin(angle) * i * 3
      });
    }

    return {
      isPlayer: !!opts.isPlayer,
      name: opts.name || pick(BOT_NAMES),
      palette,
      segments,
      angle,
      targetAngle: angle,
      turnRate: 0.09,
      baseSpeed: 2.4,
      boostSpeed: 4.6,
      boosting: false,
      boostBleed: 0,
      length: startLength,
      score: 0,
      radius: 8,
      alive: true,
      aiTimer: 0,
      aiTarget: null
    };
  }

  function spawnBot() {
    const angle = Math.random() * TAU;
    const r = rand(WORLD_RADIUS * 0.3, WORLD_RADIUS * 0.85);
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    const heading = Math.atan2(-y, -x) + rand(-1, 1);
    const len = randInt(8, 30);
    return makeSnake({
      x, y, angle: heading, length: len,
      name: pick(BOT_NAMES) + (Math.random() < 0.4 ? randInt(1, 99) : '')
    });
  }

  function initSnakes() {
    snakes.length = 0;
    player = makeSnake({ isPlayer: true, name: 'You', x: 0, y: 0, angle: 0, length: 10 });
    snakes.push(player);
    for (let i = 0; i < BOT_COUNT; i++) snakes.push(spawnBot());
  }

  function snakeRadius(s) {
    return 7 + Math.min(12, Math.sqrt(s.length) * 0.6);
  }

  function snakeSpeed(s) {
    return s.boosting && s.length > 6 ? s.boostSpeed : s.baseSpeed;
  }

  function updateSnake(s, dt) {
    if (!s.alive) return;

    const diff = angleDiff(s.angle, s.targetAngle);
    const turn = clamp(diff, -s.turnRate, s.turnRate);
    s.angle += turn;

    if (s.boosting && s.length > 6) {
      s.boostBleed += dt;
      if (s.boostBleed > 0.18) {
        s.boostBleed = 0;
        s.length = Math.max(6, s.length - 1);
        const tail = s.segments[s.segments.length - 1];
        if (tail) {
          food.push(makeFood(tail.x + rand(-4, 4), tail.y + rand(-4, 4), 1, false, s.palette[0]));
        }
      }
    } else {
      s.boosting = false;
    }

    const sp = snakeSpeed(s);
    const head = s.segments[0];
    const newHead = {
      x: head.x + Math.cos(s.angle) * sp,
      y: head.y + Math.sin(s.angle) * sp
    };
    s.segments.unshift(newHead);

    const segCount = Math.max(8, Math.floor(s.length * 2));
    while (s.segments.length > segCount) s.segments.pop();

    s.radius = snakeRadius(s);

    const distFromCenter = Math.hypot(newHead.x, newHead.y);
    if (distFromCenter > WORLD_RADIUS) {
      killSnake(s);
    }
  }

  function killSnake(s) {
    if (!s.alive) return;
    s.alive = false;
    const drops = Math.min(80, Math.floor(s.length * 1.5));
    for (let i = 0; i < drops; i++) {
      const seg = s.segments[Math.floor((i / drops) * s.segments.length)];
      if (!seg) continue;
      const value = randInt(1, 3);
      food.push(makeFood(
        seg.x + rand(-8, 8),
        seg.y + rand(-8, 8),
        value, true,
        s.palette[Math.random() < 0.5 ? 0 : 1]
      ));
    }
    if (s.isPlayer) {
      setTimeout(showGameOver, 600);
    } else {
      setTimeout(() => {
        const idx = snakes.indexOf(s);
        if (idx >= 0) snakes[idx] = spawnBot();
      }, 1500);
    }
  }

  function checkFoodCollisions(s) {
    if (!s.alive) return;
    const head = s.segments[0];
    const eatRadius = s.radius + 14;
    const eatR2 = eatRadius * eatRadius;

    for (let i = food.length - 1; i >= 0; i--) {
      const f = food[i];
      if (dist2(head.x, head.y, f.x, f.y) < eatR2) {
        s.length += f.value;
        s.score += f.value * 10;
        food.splice(i, 1);
      }
    }
  }

  function checkSnakeCollisions(s) {
    if (!s.alive) return;
    const head = s.segments[0];
    const hr = s.radius;

    for (const other of snakes) {
      if (!other.alive || other === s) continue;
      const segs = other.segments;
      const otherR = other.radius;
      const collideR = hr + otherR * 0.85;
      const collideR2 = collideR * collideR;

      for (let i = 0; i < segs.length; i += 2) {
        const seg = segs[i];
        if (dist2(head.x, head.y, seg.x, seg.y) < collideR2) {
          killSnake(s);
          return;
        }
      }
    }
  }

  function updateBotAI(s, dt) {
    if (!s.alive || s.isPlayer) return;

    s.aiTimer -= dt;
    const head = s.segments[0];
    const distFromCenter = Math.hypot(head.x, head.y);

    if (distFromCenter > WORLD_RADIUS * 0.85) {
      s.targetAngle = Math.atan2(-head.y, -head.x) + rand(-0.3, 0.3);
      s.boosting = distFromCenter > WORLD_RADIUS * 0.95 && s.length > 10;
      return;
    }

    const lookAhead = 80 + (s.boosting ? 60 : 0);
    const ahead = {
      x: head.x + Math.cos(s.angle) * lookAhead,
      y: head.y + Math.sin(s.angle) * lookAhead
    };

    let dangerAngle = null;
    let minDanger = Infinity;
    for (const other of snakes) {
      if (!other.alive || other === s) continue;
      for (let i = 0; i < other.segments.length; i += 4) {
        const seg = other.segments[i];
        const d = dist2(ahead.x, ahead.y, seg.x, seg.y);
        const threat = (other.radius + s.radius + 30);
        if (d < threat * threat && d < minDanger) {
          minDanger = d;
          dangerAngle = Math.atan2(seg.y - head.y, seg.x - head.x);
        }
      }
    }

    if (dangerAngle != null) {
      s.targetAngle = dangerAngle + Math.PI + rand(-0.2, 0.2);
      s.boosting = false;
      return;
    }

    if (s.aiTimer <= 0 || !s.aiTarget) {
      s.aiTimer = rand(0.4, 1.2);
      let best = null;
      let bestScore = -Infinity;
      const sampleStart = Math.floor(Math.random() * Math.max(1, food.length - 30));
      const end = Math.min(food.length, sampleStart + 60);
      for (let i = sampleStart; i < end; i++) {
        const f = food[i];
        const d = dist2(head.x, head.y, f.x, f.y);
        const score = f.value * 100 - d * 0.001;
        if (score > bestScore) { bestScore = score; best = f; }
      }
      s.aiTarget = best;
    }

    if (s.aiTarget) {
      s.targetAngle = Math.atan2(s.aiTarget.y - head.y, s.aiTarget.x - head.x);
    } else if (s.aiTimer <= 0) {
      s.targetAngle = s.angle + rand(-0.8, 0.8);
    }

    s.boosting = (s.length > 20 && Math.random() < 0.005);
  }

  function setupInput() {
    function isLeftSide(x) { return x < viewW / 2; }

    function updateSteerAngle() {
      const dx = input.steerCurX - input.steerOriginX;
      const dy = input.steerCurY - input.steerOriginY;
      // Small deadzone so a stationary thumb doesn't jitter
      if (dx * dx + dy * dy > 64) {
        input.targetAngle = Math.atan2(dy, dx);
        input.hasTarget = true;
      }
    }

    function handleTouchStart(e) {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (isLeftSide(t.clientX)) {
          // Left side = boost
          if (input.boostTouchId === null) {
            input.boostTouchId = t.identifier;
            input.boost = true;
          }
        } else {
          // Right side = steer joystick
          if (input.steerTouchId === null) {
            input.steerTouchId = t.identifier;
            input.steerOriginX = t.clientX;
            input.steerOriginY = t.clientY;
            input.steerCurX = t.clientX;
            input.steerCurY = t.clientY;
            showJoystick(t.clientX, t.clientY);
          }
        }
      }
    }

    function handleTouchMove(e) {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === input.steerTouchId) {
          input.steerCurX = t.clientX;
          input.steerCurY = t.clientY;
          updateSteerAngle();
          updateJoystickThumb();
        }
      }
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === input.steerTouchId) {
          input.steerTouchId = null;
          hideJoystick();
        }
        if (t.identifier === input.boostTouchId) {
          input.boostTouchId = null;
          input.boost = false;
        }
      }
    }

    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    // Desktop fallback: mouse on right half steers, left mouse button or space boosts
    let mouseDown = false;
    canvas.addEventListener('mousedown', (e) => {
      if (isLeftSide(e.clientX)) {
        input.boost = true;
      } else {
        mouseDown = true;
        input.steerOriginX = e.clientX;
        input.steerOriginY = e.clientY;
        input.steerCurX = e.clientX;
        input.steerCurY = e.clientY;
        showJoystick(e.clientX, e.clientY);
        updateSteerAngle();
      }
    });
    canvas.addEventListener('mousemove', (e) => {
      if (mouseDown) {
        input.steerCurX = e.clientX;
        input.steerCurY = e.clientY;
        updateSteerAngle();
        updateJoystickThumb();
      } else if (!isLeftSide(e.clientX)) {
        // Passive mouse steering on right side
        const cx = viewW * 0.75;
        const cy = viewH / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        if (dx * dx + dy * dy > 100) {
          input.targetAngle = Math.atan2(dy, dx);
          input.hasTarget = true;
        }
      }
    });
    canvas.addEventListener('mouseup', () => {
      mouseDown = false;
      input.boost = false;
      hideJoystick();
    });
    canvas.addEventListener('mouseleave', () => {
      mouseDown = false;
      input.boost = false;
      hideJoystick();
    });

    window.addEventListener('keydown', (e) => { if (e.code === 'Space') input.boost = true; });
    window.addEventListener('keyup', (e) => { if (e.code === 'Space') input.boost = false; });
  }

  // Virtual joystick visual
  function showJoystick(x, y) {
    const base = document.getElementById('joyBase');
    const thumb = document.getElementById('joyThumb');
    base.style.left = x + 'px';
    base.style.top = y + 'px';
    thumb.style.left = x + 'px';
    thumb.style.top = y + 'px';
    base.style.opacity = '1';
    thumb.style.opacity = '1';
  }

  function hideJoystick() {
    document.getElementById('joyBase').style.opacity = '0';
    document.getElementById('joyThumb').style.opacity = '0';
  }

  function updateJoystickThumb() {
    const thumb = document.getElementById('joyThumb');
    const maxR = 50;
    const dx = input.steerCurX - input.steerOriginX;
    const dy = input.steerCurY - input.steerOriginY;
    const d = Math.hypot(dx, dy);
    const clampedD = Math.min(d, maxR);
    const ratio = d > 0 ? clampedD / d : 0;
    thumb.style.left = (input.steerOriginX + dx * ratio) + 'px';
    thumb.style.top = (input.steerOriginY + dy * ratio) + 'px';
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.floor(viewW * dpr);
    canvas.height = Math.floor(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    camera.zoom = Math.min(1.2, Math.max(0.7, viewW / 900));
  }

  function worldToScreen(wx, wy) {
    return {
      x: (wx - camera.x) * camera.zoom + viewW / 2,
      y: (wy - camera.y) * camera.zoom + viewH / 2
    };
  }

  function drawBackground() {
    const g = ctx.createRadialGradient(viewW/2, viewH/2, 0, viewW/2, viewH/2, Math.max(viewW, viewH));
    g.addColorStop(0, '#0f1530');
    g.addColorStop(1, '#07091a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);

    const gridSize = 50 * camera.zoom;
    const offsetX = ((-camera.x * camera.zoom + viewW / 2) % gridSize + gridSize) % gridSize;
    const offsetY = ((-camera.y * camera.zoom + viewH / 2) % gridSize + gridSize) % gridSize;
    ctx.fillStyle = 'rgba(120, 180, 255, 0.08)';
    for (let y = offsetY - gridSize; y < viewH + gridSize; y += gridSize) {
      for (let x = offsetX - gridSize; x < viewW + gridSize; x += gridSize) {
        ctx.beginPath();
        ctx.arc(x, y, 1.2, 0, TAU);
        ctx.fill();
      }
    }

    const center = worldToScreen(0, 0);
    const r = WORLD_RADIUS * camera.zoom;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 77, 109, 0.4)';
    ctx.lineWidth = 4;
    ctx.setLineDash([12, 8]);
    ctx.lineDashOffset = -frame * 0.3;
    ctx.beginPath();
    ctx.arc(center.x, center.y, r, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  function drawFood() {
    for (const f of food) {
      const s = worldToScreen(f.x, f.y);
      if (s.x < -30 || s.x > viewW + 30 || s.y < -30 || s.y > viewH + 30) continue;

      const pulse = 1 + Math.sin(f.pulse + frame * 0.06) * 0.15;
      const r = f.radius * camera.zoom * pulse;

      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 2.2, 0, TAU);
      const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 2.2);
      grad.addColorStop(0, f.color + 'aa');
      grad.addColorStop(0.4, f.color + '33');
      grad.addColorStop(1, f.color + '00');
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, TAU);
      ctx.fillStyle = f.color;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(s.x - r * 0.3, s.y - r * 0.3, r * 0.4, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fill();
    }
  }

  function drawSnake(s) {
    if (!s.alive) return;
    const segs = s.segments;
    if (segs.length === 0) return;

    const r = s.radius * camera.zoom;
    const c1 = s.palette[0];
    const c2 = s.palette[1];
    const c3 = s.palette[2];

    if (s.boosting) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = segs.length - 1; i >= 0; i -= 3) {
        const seg = segs[i];
        const sc = worldToScreen(seg.x, seg.y);
        if (sc.x < -50 || sc.x > viewW + 50 || sc.y < -50 || sc.y > viewH + 50) continue;
        ctx.beginPath();
        ctx.arc(sc.x, sc.y, r * 1.8, 0, TAU);
        const g = ctx.createRadialGradient(sc.x, sc.y, 0, sc.x, sc.y, r * 1.8);
        g.addColorStop(0, c1 + '66');
        g.addColorStop(1, c1 + '00');
        ctx.fillStyle = g;
        ctx.fill();
      }
      ctx.restore();
    }

    for (let i = segs.length - 1; i >= 0; i--) {
      const seg = segs[i];
      const sc = worldToScreen(seg.x, seg.y);
      if (sc.x < -50 || sc.x > viewW + 50 || sc.y < -50 || sc.y > viewH + 50) continue;

      ctx.beginPath();
      ctx.arc(sc.x, sc.y, r, 0, TAU);
      ctx.fillStyle = c2;
      ctx.fill();

      const stripe = Math.floor(i / 2) % 2 === 0;
      ctx.beginPath();
      ctx.arc(sc.x, sc.y, r * 0.78, 0, TAU);
      ctx.fillStyle = stripe ? c1 : c3;
      ctx.fill();
    }

    const head = segs[0];
    const hs = worldToScreen(head.x, head.y);
    const eyeOffset = r * 0.45;
    const eyeR = r * 0.28;
    const angle = s.angle;
    const perpX = Math.cos(angle + Math.PI / 2);
    const perpY = Math.sin(angle + Math.PI / 2);
    const fwdX = Math.cos(angle);
    const fwdY = Math.sin(angle);

    for (const sign of [-1, 1]) {
      const ex = hs.x + perpX * eyeOffset * sign + fwdX * r * 0.2;
      const ey = hs.y + perpY * eyeOffset * sign + fwdY * r * 0.2;
      ctx.beginPath();
      ctx.arc(ex, ey, eyeR, 0, TAU);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + fwdX * eyeR * 0.4, ey + fwdY * eyeR * 0.4, eyeR * 0.55, 0, TAU);
      ctx.fillStyle = '#0a0a0a';
      ctx.fill();
    }

    if (!s.isPlayer || camera.zoom < 0.9) {
      ctx.save();
      ctx.font = `${Math.max(10, 12 * camera.zoom)}px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const ty = hs.y - r - 14;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillText(s.name, hs.x + 1, ty + 1);
      ctx.fillStyle = s.isPlayer ? '#ffd24a' : '#eaf0ff';
      ctx.fillText(s.name, hs.x, ty);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    drawFood();
    for (const s of snakes) if (s !== player) drawSnake(s);
    if (player) drawSnake(player);
  }

  function updateLeaderboard() {
    const sorted = [...snakes].filter(s => s.alive).sort((a, b) => b.length - a.length).slice(0, 5);
    const lbRows = document.getElementById('lbRows');
    let html = '';
    sorted.forEach((s, i) => {
      const cls = s.isPlayer ? 'lb-row you' : 'lb-row';
      html += `<div class="${cls}"><span class="name">${i + 1}. ${s.name}</span><span>${s.length}</span></div>`;
    });
    if (player && player.alive && !sorted.includes(player)) {
      const allSorted = [...snakes].filter(s => s.alive).sort((a, b) => b.length - a.length);
      const rank = allSorted.indexOf(player) + 1;
      html += `<div class="lb-row you" style="border-top:1px solid rgba(255,255,255,0.1);margin-top:4px;padding-top:4px"><span class="name">${rank}. You</span><span>${player.length}</span></div>`;
    }
    lbRows.innerHTML = html;
  }

  function tick(time) {
    if (!running) return;
    if (!lastTime) lastTime = time;
    const dt = Math.min(0.05, (time - lastTime) / 1000);
    lastTime = time;
    frame++;

    if (player && player.alive) {
      if (input.hasTarget) player.targetAngle = input.targetAngle;
      player.boosting = input.boost && player.length > 6;
    }

    for (const s of snakes) {
      if (!s.isPlayer) updateBotAI(s, dt);
    }

    for (const s of snakes) updateSnake(s, dt);

    for (const s of snakes) checkFoodCollisions(s);
    for (const s of snakes) checkSnakeCollisions(s);

    while (food.length < FOOD_COUNT) food.push(spawnFoodInWorld());

    if (player && player.alive) {
      const head = player.segments[0];
      camera.x = lerp(camera.x, head.x, 0.15);
      camera.y = lerp(camera.y, head.y, 0.15);
    }

    render();

    if (player) {
      document.getElementById('score').textContent = player.score;
      document.getElementById('length').textContent = player.length;
      const boostBar = document.getElementById('boostBar');
      const boostFill = document.getElementById('boostFill');
      const boostPct = clamp((player.length - 6) / 30, 0, 1);
      boostFill.style.width = (boostPct * 100) + '%';
      boostBar.classList.toggle('boosting', player.boosting);
      document.getElementById('boostZone').classList.toggle('active', player.boosting);
    }

    if (frame % 20 === 0) updateLeaderboard();

    requestAnimationFrame(tick);
  }

  function startGame() {
    document.body.classList.remove('menu');
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    initFood();
    initSnakes();
    camera.x = 0;
    camera.y = 0;
    running = true;
    lastTime = 0;
    requestAnimationFrame(tick);
  }

  function showGameOver() {
    running = false;
    document.body.classList.add('menu');
    if (player) {
      document.getElementById('finalScore').textContent = player.score;
      document.getElementById('finalLength').textContent = player.length;
      const allLengths = snakes.map(s => s.length);
      const rank = allLengths.filter(l => l > player.length).length + 1;
      document.getElementById('finalRank').textContent = '#' + rank;
    }
    document.getElementById('gameOverOverlay').classList.remove('hidden');
  }

  window.addEventListener('resize', resize);
  resize();
  setupInput();

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  function idleRender() {
    if (running) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    frame++;
    requestAnimationFrame(idleRender);
  }
  idleRender();

})();
</script>
</body>
</html>
